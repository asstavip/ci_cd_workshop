name: Steps multi-job Workflow

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: print testing backend
        run: echo "Testing backend"
  
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: print testing frontend
        run: echo "Testing frontend"  