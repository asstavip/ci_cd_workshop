name : environment variables workflow

on :
  pull_request:
    
  push:
    branches: [ main ]  

jobs:
  build:
    runs-on : ubuntu-latest

    env:
      PROJECT_NAME: "ZeroOps Production"
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install pytest
        run: pip install pytest

      - name: run tests
        run: python -m pytest

      - name: done
        run: echo "Done with the workflow"  